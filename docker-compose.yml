# Local development: Postgres + the API.   docker compose up --build   ->  http://localhost:8080/docs
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: spa, POSTGRES_PASSWORD: spa, POSTGRES_DB: spa }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U spa -d spa"], interval: 5s, retries: 10 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      PG_DSN: postgresql://spa:spa@db:5432/spa
      ADMIN_PASSWORD: admin12345
      SPA_CORS_ORIGINS: http://localhost:4200
    ports: ["8080:8080"]
volumes:
  pgdata:
