name: Backend tests
on:
  push:
    branches: [main, feature/priority-one-operations-release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/spa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify generated SQL schema
        run: python -m unittest tests.test_schema_files.TestSchemaFiles -v
        env:
          TEST_PG_DSN: ""
      - name: Run API and PostgreSQL integration tests
        run: python -m unittest tests.test_spa -v
