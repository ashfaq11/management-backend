name: Backend tests
on:
  push:
    branches: [main, feature/priority-one-operations-release-v2]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/spa_test
      PG_DSN: postgresql://postgres:postgres@localhost:5432/spa_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate SQL and catalog documentation
        run: |
          python tools/build_schema.py
          python tools/schema_doc.py
      - name: Commit generated schema documentation to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- sql/schema.sql docs/schema.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sql/schema.sql docs/schema.md
            git commit -m "Regenerate database schema documentation"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Verify generated schema snapshot and documentation
        run: python -m unittest tests.test_schema_files -v
      - name: Run PostgreSQL API integration tests
        run: python -m unittest tests.test_spa -v
