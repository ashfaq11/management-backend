# Render Blueprint: free web service for the API (Dashboard -> New -> Blueprint -> pick this repo).
# The free tier sleeps after ~15 min without traffic and wakes in about a minute; see README "Free hosting".
services:
  - type: web
    name: spa-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PG_DSN              # Neon *direct* connection string (not the -pooler host), with ?sslmode=require
        sync: false
      - key: SPA_CORS_ORIGINS    # your Cloudflare Pages address, e.g. https://management-ui.pages.dev
        sync: false
      - key: ADMIN_PASSWORD      # generated by Render; read it in the service's Environment tab
        generateValue: true
      - key: SPA_NAME
        value: Serenity Spa
